[workspace]
members = [
    "crates/runtimed-core",
    "crates/runtimed-daemon",
    "crates/runtimectl",
    "qa/unit",
    "qa/edge",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.80.0"
license = "Apache-2.0"
authors = ["Syntropd Authors <syntropd@users.noreply.github.com>"]
repository = "https://github.com/syntropd/runtimed"

[workspace.dependencies]
anyhow = "1.0.86"
clap = { version = "4.5.13", features = ["derive", "env"] }
clap_complete = "4.5.13"
libc = "0.2.155"
rustix = { version = "0.38.34", features = ["fs", "net", "process", "param", "event"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
tempfile = "3.10.1"
thiserror = "1.0.63"
tokio = { version = "1.39.2", features = ["full"] }
toml = "0.8.19"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[profile.release]
# Thin LTO + stripped symbols: smaller, faster binaries, portable x86-64.
lto = "thin"
strip = true
