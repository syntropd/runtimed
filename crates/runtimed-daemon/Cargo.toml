[package]
name = "syntrop-runtimed"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Sysext and portable systemd image runtime orchestrator for syntropd"
autotests = false

[features]
qa-test-helpers = ["runtimed-core/qa-test-helpers"]
cuda = ["runtimed-core/cuda"]

[lib]
name = "runtimed_daemon"
path = "src/lib.rs"

[[bin]]
name = "runtimed"
path = "src/main.rs"

[[test]]
name = "integration_tests"
path = "tests/integration.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
image.workspace = true
libc.workspace = true
rustix.workspace = true
runtimed-core = { package = "syntrop-runtimed-core", version = "0.6.2", path = "../runtimed-core" }
runtimed-model = { package = "syntrop-runtimed-model", version = "0.6.2", path = "../runtimed-model" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true